<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Swagger UI</title>
    <link rel="stylesheet" type="text/css" href="/assets/vendor/swagger-ui.css">
    <link rel="stylesheet" type="text/css" href="/assets/vendor/index.css">
    <link rel="icon" type="image/png" href="/assets/vendor/favicon-32x32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="/assets/vendor/favicon-16x16.png" sizes="16x16">
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="/assets/vendor/swagger-ui-bundle.js" charset="UTF-8"></script>
    <script src="/assets/vendor/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
    <script>
      window.onload = function () {
        const role = location.pathname.endsWith('/admin') ? 'admin' : 'user';
        window.ui = SwaggerUIBundle({
          urls: [
            { name: 'user', url: '/openapi/user.json' },
            { name: 'admin', url: '/openapi/admin.json' }
          ],
          'urls.primaryName': role,
          dom_id: '#swagger-ui',
          deepLinking: true,
          presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset
          ],
          plugins: [
            SwaggerUIBundle.plugins.DownloadUrl
          ],
          layout: 'StandaloneLayout'
        });
      };
    </script>
  </body>
</html>
