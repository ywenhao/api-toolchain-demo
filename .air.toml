root = "."
tmp_dir = ".tmp"

[build]
cmd = "mise run generate && go build -o ./.tmp/server ./cmd/server"
entrypoint = ["./.tmp/server"]
include_ext = ["go", "proto", "html", "css", "js", "json", "md"]
exclude_dir = [".tmp", ".git", "gen", "openapi", "web/vendor"]
exclude_regex = ["_test.go"]
exclude_unchanged = true
delay = 400
stop_on_error = true
send_interrupt = true
kill_delay = "2s"

[log]
time = false

[misc]
clean_on_exit = true
